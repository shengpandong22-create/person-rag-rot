<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="680" height="820">
  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 2L8 5L1 8" fill="#888"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .t { font: 13px sans-serif; fill: #2C2C2A; }
      .ts { font: 11px sans-serif; fill: #5F5E5A; }
      .th { font: 500 14px sans-serif; fill: #2C2C2A; }
      .title { font: 700 17px sans-serif; fill: #2C2C2A; }
      .subtitle { font: 12px sans-serif; fill: #5F5E5A; }
      .arr { stroke: #888; stroke-width: 1.8; fill: none; marker-end: url(#arr-d); }
      .arr-dash { stroke: #888; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; marker-end: url(#arr-d); }
      .layer-box { fill: none; stroke: #B0B0B0; stroke-width: 1.2; stroke-dasharray: 6 3; }
      .layer-badge { font: 500 11px sans-serif; fill: #666; }
      .node-blue { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1.4; }
      .node-purple { fill: #EEEDFE; stroke: #7F77DD; stroke-width: 1.4; }
      .node-green { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 1.4; }
      .node-orange { fill: #FAECE7; stroke: #D85A30; stroke-width: 1.4; }
      .node-pink { fill: #FBEAF0; stroke: #D4537E; stroke-width: 1.4; }
      .node-gray { fill: #F1EFE8; stroke: #888780; stroke-width: 1.2; }
      .txt-blue { fill: #042C53; }
      .txt-purple { fill: #26215C; }
      .txt-green { fill: #04342C; }
      .txt-orange { fill: #712B13; }
      .txt-pink { fill: #4B1528; }
      .txt-gray { fill: #2C2C2A; }
    </style>
  </defs>

  <rect class="bg" width="680" height="746"/>
  <text class="title" x="340" y="26" text-anchor="middle">AgentMentor V2 面试版总体架构</text>
  <text class="subtitle" x="340" y="46" text-anchor="middle">RAG 证据、模拟面试、可信评分、画像闭环与工程收口</text>

  <!-- 第1层 交互层 -->
  <rect class="layer-box" x="28" y="60" width="624" height="88" rx="10"/>
  <text class="layer-badge" x="40" y="76">第1层 · 交互层</text>
  <rect class="node-blue" x="150" y="84" width="380" height="52" rx="8"/>
  <text class="th txt-blue" x="340" y="104" text-anchor="middle">React 工作台</text>
  <text class="ts" x="340" y="124" text-anchor="middle">知识库 / RAG / 面试（训练 + practice）/ 报告 / 画像</text>

  <line x1="340" y1="148" x2="340" y2="188" class="arr"/>

  <!-- 第2层 接口层 -->
  <rect class="layer-box" x="28" y="192" width="624" height="104" rx="10"/>
  <text class="layer-badge" x="40" y="208">第2层 · 接口层</text>
  <rect class="node-blue" x="44" y="220" width="372" height="64" rx="8"/>
  <text class="th txt-blue" x="230" y="240" text-anchor="middle">FastAPI API</text>
  <text class="ts" x="230" y="258" text-anchor="middle">参数校验 / 统一异常 / 响应契约</text>
  <text class="ts" x="230" y="274" text-anchor="middle">knowledge / chat / interviews / evaluations / profiles</text>
  <rect class="node-orange" x="452" y="220" width="184" height="64" rx="8"/>
  <text class="th txt-orange" x="544" y="240" text-anchor="middle">大模型服务</text>
  <text class="ts" x="544" y="258" text-anchor="middle">DeepSeek / OpenAI 兼容</text>
  <text class="ts" x="544" y="274" text-anchor="middle">失败时确定性降级</text>
  <line x1="416" y1="252" x2="450" y2="252" class="arr-dash"/>
  <text class="ts" x="433" y="244" text-anchor="middle">受控调用</text>

  <line x1="340" y1="296" x2="340" y2="336" class="arr"/>

  <!-- 第3层 应用服务层 -->
  <rect class="layer-box" x="28" y="340" width="624" height="104" rx="10"/>
  <text class="layer-badge" x="40" y="356">第3层 · 应用服务层</text>
  <rect class="node-purple" x="44" y="368" width="104" height="60" rx="8"/>
  <text class="th txt-purple" x="96" y="392" text-anchor="middle">Knowledge</text>
  <text class="ts" x="96" y="410" text-anchor="middle">入库与检索</text>
  <rect class="node-purple" x="166" y="368" width="104" height="60" rx="8"/>
  <text class="th txt-purple" x="218" y="392" text-anchor="middle">Answer</text>
  <text class="ts" x="218" y="410" text-anchor="middle">RAG 与引用</text>
  <rect class="node-purple" x="288" y="368" width="104" height="60" rx="8"/>
  <text class="th txt-purple" x="340" y="392" text-anchor="middle">Interview</text>
  <text class="ts" x="340" y="410" text-anchor="middle">状态机与模式</text>
  <rect class="node-purple" x="410" y="368" width="104" height="60" rx="8"/>
  <text class="th txt-purple" x="462" y="392" text-anchor="middle">Evaluation</text>
  <text class="ts" x="462" y="410" text-anchor="middle">Rubric 评分</text>
  <rect class="node-purple" x="532" y="368" width="104" height="60" rx="8"/>
  <text class="th txt-purple" x="584" y="392" text-anchor="middle">Profile</text>
  <text class="ts" x="584" y="410" text-anchor="middle">画像与复习</text>

  <line x1="340" y1="444" x2="340" y2="484" class="arr"/>

  <!-- 第4层 领域 / RAG 证据链 / 基础设施 -->
  <rect class="layer-box" x="28" y="488" width="624" height="164" rx="10"/>
  <text class="layer-badge" x="40" y="504">第4层 · 领域规则 / RAG 证据链 / 基础设施</text>
  <rect class="node-purple" x="44" y="516" width="190" height="124" rx="8"/>
  <text class="th txt-purple" x="139" y="536" text-anchor="middle">领域与工作流</text>
  <text class="ts" x="139" y="556" text-anchor="middle">状态机 / Rubric / 画像规则</text>
  <text class="ts" x="139" y="574" text-anchor="middle">TrainingMode 模式契约</text>
  <text class="ts" x="139" y="592" text-anchor="middle">workflow checkpoint</text>
  <text class="ts" x="139" y="612" text-anchor="middle">coverage 来源绑定规则</text>
  <rect class="node-green" x="245" y="516" width="190" height="124" rx="8"/>
  <text class="th txt-green" x="340" y="536" text-anchor="middle">RAG 与证据链</text>
  <text class="ts" x="340" y="556" text-anchor="middle">DocumentParser / Chunking</text>
  <text class="ts" x="340" y="574" text-anchor="middle">Retriever / 引用白名单</text>
  <text class="ts" x="340" y="592" text-anchor="middle">Embedding Provider</text>
  <text class="ts" x="340" y="610" text-anchor="middle">development 默认</text>
  <text class="ts" x="340" y="628" text-anchor="middle">部署可启用 BGE</text>
  <rect class="node-pink" x="446" y="516" width="190" height="124" rx="8"/>
  <text class="th txt-pink" x="541" y="536" text-anchor="middle">基础设施层</text>
  <text class="ts" x="541" y="556" text-anchor="middle">PostgreSQL / pgvector</text>
  <text class="ts" x="541" y="574" text-anchor="middle">HTTP Client / 本地文件卷</text>
  <text class="ts" x="541" y="592" text-anchor="middle">实际生效配置以</text>
  <text class="ts" x="541" y="610" text-anchor="middle">/health/runtime 为准</text>

  <line x1="340" y1="648" x2="340" y2="676" class="arr"/>

  <!-- 部署条 -->
  <rect class="node-gray" x="120" y="680" width="440" height="36" rx="8"/>
  <text class="th txt-gray" x="340" y="702" text-anchor="middle">db + api + frontend 三容器，本地 16GB 开发机可运行（无 GPU）</text>

  <!-- 图例 -->
  <rect x="28" y="728" width="624" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <rect x="40" y="733" width="14" height="12" rx="2" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text class="ts" x="58" y="743" dominant-baseline="central">用户交互</text>
  <rect x="112" y="733" width="14" height="12" rx="2" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text class="ts" x="130" y="743" dominant-baseline="central">编排与规则</text>
  <rect x="196" y="733" width="14" height="12" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text class="ts" x="214" y="743" dominant-baseline="central">RAG 证据链</text>
  <rect x="278" y="733" width="14" height="12" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text class="ts" x="296" y="743" dominant-baseline="central">外部模型</text>
  <rect x="352" y="733" width="14" height="12" rx="2" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
  <text class="ts" x="370" y="743" dominant-baseline="central">存储基础设施</text>
  <rect x="446" y="733" width="14" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="ts" x="464" y="743" dominant-baseline="central">部署</text>
</svg>

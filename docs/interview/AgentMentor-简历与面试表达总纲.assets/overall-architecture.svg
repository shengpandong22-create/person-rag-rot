<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img">
  <title>AgentMentor V2 面试版总体架构</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .zone-title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 500 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .small { font: 500 13px Consolas, "Microsoft YaHei", monospace; fill: #64748b; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 26; filter: url(#shadow); }
      .blue { fill: #e8f3ff; stroke: #2f80c9; stroke-width: 3; rx: 18; }
      .cyan { fill: #dcfafa; stroke: #0e9f9a; stroke-width: 3; rx: 18; }
      .green { fill: #e2f6ef; stroke: #0f766e; stroke-width: 3; rx: 18; }
      .orange { fill: #fff3df; stroke: #d97706; stroke-width: 3; rx: 18; }
      .coral { fill: #fff0eb; stroke: #c05621; stroke-width: 3; rx: 18; }
      .purple { fill: #f1edff; stroke: #7c3aed; stroke-width: 3; rx: 18; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="860"/>
  <text x="640" y="56" text-anchor="middle" class="title">AgentMentor V2 面试版总体架构</text>
  <text x="640" y="88" text-anchor="middle" class="subtitle">RAG 证据、模拟面试、可信评分、画像闭环与工程审计收口</text>

  <rect x="70" y="125" width="1140" height="105" class="zone"/>
  <text x="95" y="162" class="zone-title">交互层</text>
  <rect x="235" y="150" width="190" height="55" class="blue"/>
  <text x="330" y="184" text-anchor="middle" class="node-title">React 工作台</text>
  <rect x="455" y="150" width="138" height="55" class="blue"/>
  <text x="524" y="184" text-anchor="middle" class="node-title">知识库</text>
  <rect x="625" y="150" width="110" height="55" class="blue"/>
  <text x="680" y="184" text-anchor="middle" class="node-title">RAG</text>
  <rect x="765" y="150" width="110" height="55" class="blue"/>
  <text x="820" y="184" text-anchor="middle" class="node-title">面试</text>
  <rect x="905" y="150" width="110" height="55" class="blue"/>
  <text x="960" y="184" text-anchor="middle" class="node-title">报告</text>
  <rect x="1045" y="150" width="110" height="55" class="blue"/>
  <text x="1100" y="184" text-anchor="middle" class="node-title">画像</text>

  <path d="M640 230 L640 270" class="arrow"/>

  <rect x="70" y="270" width="860" height="115" class="zone"/>
  <text x="95" y="310" class="zone-title">接口层</text>
  <text x="235" y="314" class="node-title">FastAPI API</text>
  <text x="235" y="344" class="node-text">参数校验、统一异常、响应契约</text>
  <text x="235" y="368" class="small">knowledge / chat / interviews / evaluations / profiles / demo / health</text>

  <rect x="970" y="270" width="240" height="115" class="coral"/>
  <text x="1090" y="310" text-anchor="middle" class="node-title">大模型服务</text>
  <text x="1090" y="340" text-anchor="middle" class="node-text">DeepSeek / OpenAI 兼容</text>
  <text x="1090" y="364" text-anchor="middle" class="node-text">失败时确定性降级</text>
  <path d="M930 327 L970 327" class="dash"/>

  <path d="M500 385 L500 430" class="arrow"/>

  <rect x="70" y="430" width="1140" height="150" class="zone"/>
  <text x="95" y="470" class="zone-title">应用服务层</text>
  <rect x="220" y="485" width="175" height="62" class="blue"/>
  <text x="307" y="511" text-anchor="middle" class="node-title">Knowledge</text>
  <text x="307" y="535" text-anchor="middle" class="node-text">入库与索引</text>
  <rect x="420" y="485" width="175" height="62" class="blue"/>
  <text x="507" y="511" text-anchor="middle" class="node-title">Answer</text>
  <text x="507" y="535" text-anchor="middle" class="node-text">RAG 与引用</text>
  <rect x="620" y="485" width="175" height="62" class="blue"/>
  <text x="707" y="511" text-anchor="middle" class="node-title">Interview</text>
  <text x="707" y="535" text-anchor="middle" class="node-text">状态机与幂等</text>
  <rect x="820" y="485" width="175" height="62" class="orange"/>
  <text x="907" y="511" text-anchor="middle" class="node-title">Evaluation</text>
  <text x="907" y="535" text-anchor="middle" class="node-text">Rubric 评分</text>
  <rect x="1020" y="485" width="155" height="62" class="green"/>
  <text x="1097" y="511" text-anchor="middle" class="node-title">Profile</text>
  <text x="1097" y="535" text-anchor="middle" class="node-text">画像与复习</text>

  <path d="M640 580 L640 620" class="arrow"/>

  <rect x="70" y="620" width="350" height="115" class="purple"/>
  <text x="245" y="660" text-anchor="middle" class="node-title">领域与工作流</text>
  <text x="245" y="690" text-anchor="middle" class="node-text">interview / evaluation / profile</text>
  <text x="245" y="714" text-anchor="middle" class="node-text">profile_taxonomy / workflow checkpoint</text>

  <rect x="465" y="620" width="350" height="115" class="green"/>
  <text x="640" y="660" text-anchor="middle" class="node-title">RAG 与证据层</text>
  <text x="640" y="690" text-anchor="middle" class="node-text">DocumentParser / Chunking / Retriever</text>
  <text x="640" y="714" text-anchor="middle" class="node-text">BGE Embedding / 引用白名单 / 证据门禁</text>

  <rect x="860" y="620" width="350" height="115" class="cyan"/>
  <text x="1035" y="660" text-anchor="middle" class="node-title">基础设施层</text>
  <text x="1035" y="690" text-anchor="middle" class="node-text">PostgreSQL / pgvector / HTTP Client</text>
  <text x="1035" y="714" text-anchor="middle" class="node-text">本地文件卷 / Docker Compose</text>

  <path d="M640 735 L640 780" class="arrow"/>
  <rect x="360" y="780" width="560" height="55" class="green"/>
  <text x="640" y="815" text-anchor="middle" class="node-title">db + api + frontend 三容器，本地 16GB 开发机可运行</text>
</svg>

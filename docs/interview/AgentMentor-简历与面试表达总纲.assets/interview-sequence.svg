<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
  <title>AgentMentor 模拟面试状态时序</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .lane-title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .step { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .small { font: 500 13px Consolas, "Microsoft YaHei", monospace; fill: #64748b; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .blue { fill: #e8f3ff; stroke: #2f80c9; stroke-width: 2.5; rx: 14; }
      .green { fill: #e2f6ef; stroke: #0f766e; stroke-width: 2.5; rx: 14; }
      .orange { fill: #fff3df; stroke: #d97706; stroke-width: 2.5; rx: 14; }
      .coral { fill: #fff0eb; stroke: #c05621; stroke-width: 2.5; rx: 14; }
      .purple { fill: #f1edff; stroke: #7c3aed; stroke-width: 2.5; rx: 14; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .main { stroke: #d97706; stroke-width: 3.5; fill: none; marker-end: url(#orangeArrow); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="640" y="54" text-anchor="middle" class="title">模拟面试 · 状态时序</text>
  <text x="640" y="86" text-anchor="middle" class="subtitle">不是一次性请求，而是可恢复、可审计、可幂等推进的训练工作流</text>

  <rect x="55" y="125" width="230" height="595" class="lane"/>
  <rect x="320" y="125" width="230" height="595" class="lane"/>
  <rect x="585" y="125" width="230" height="595" class="lane"/>
  <rect x="850" y="125" width="230" height="595" class="lane"/>
  <rect x="1115" y="125" width="110" height="595" class="lane"/>
  <text x="170" y="162" text-anchor="middle" class="lane-title">前端</text>
  <text x="435" y="162" text-anchor="middle" class="lane-title">InterviewService</text>
  <text x="700" y="162" text-anchor="middle" class="lane-title">RAG / LLM</text>
  <text x="965" y="162" text-anchor="middle" class="lane-title">Evaluation / Profile</text>
  <text x="1170" y="162" text-anchor="middle" class="lane-title">数据库</text>

  <rect x="85" y="205" width="170" height="50" class="blue"/>
  <text x="170" y="236" text-anchor="middle" class="step">创建 / 启动面试</text>
  <path d="M255 230 L320 230" class="main"/>
  <rect x="345" y="205" width="180" height="50" class="purple"/>
  <text x="435" y="236" text-anchor="middle" class="step">加载画像并规划</text>
  <path d="M525 230 L585 230" class="line"/>
  <rect x="610" y="205" width="180" height="50" class="green"/>
  <text x="700" y="236" text-anchor="middle" class="step">检索片段</text>
  <path d="M790 230 L1115 230" class="dash"/>
  <text x="950" y="218" text-anchor="middle" class="small">WorkflowCheckpoint</text>

  <path d="M435 255 L435 315" class="main"/>
  <rect x="345" y="315" width="180" height="55" class="purple"/>
  <text x="435" y="337" text-anchor="middle" class="step">生成题目</text>
  <text x="435" y="358" text-anchor="middle" class="note">题目 / 参考答案 / Rubric</text>
  <path d="M525 342 L585 342" class="line"/>
  <rect x="610" y="315" width="180" height="55" class="coral"/>
  <text x="700" y="337" text-anchor="middle" class="step">LLM 受约束生成</text>
  <text x="700" y="358" text-anchor="middle" class="note">引用候选片段</text>
  <path d="M345 342 L255 342" class="line"/>
  <rect x="85" y="315" width="170" height="55" class="blue"/>
  <text x="170" y="337" text-anchor="middle" class="step">展示当前题目</text>
  <text x="170" y="358" text-anchor="middle" class="note">等待用户回答</text>

  <rect x="85" y="425" width="170" height="55" class="blue"/>
  <text x="170" y="448" text-anchor="middle" class="step">提交答案</text>
  <text x="170" y="469" text-anchor="middle" class="note">Idempotency-Key</text>
  <path d="M255 452 L320 452" class="main"/>
  <rect x="345" y="425" width="180" height="55" class="orange"/>
  <text x="435" y="448" text-anchor="middle" class="step">幂等写入答案</text>
  <text x="435" y="469" text-anchor="middle" class="note">未完则下一题</text>
  <path d="M525 452 L1115 452" class="dash"/>
  <text x="820" y="440" text-anchor="middle" class="small">UserAnswer + Checkpoint</text>

  <path d="M435 480 C435 520 280 520 280 342 L345 342" class="dash"/>
  <text x="300" y="535" class="note">未到最后一题：回到生成题目</text>

  <path d="M435 480 L435 570 L850 570" class="main"/>
  <rect x="875" y="540" width="180" height="60" class="orange"/>
  <text x="965" y="563" text-anchor="middle" class="step">评分与报告</text>
  <text x="965" y="585" text-anchor="middle" class="note">四维 Rubric + 逐题解释</text>
  <path d="M1055 570 L1115 570" class="dash"/>

  <path d="M965 600 L965 635" class="main"/>
  <rect x="875" y="635" width="180" height="55" class="green"/>
  <text x="965" y="658" text-anchor="middle" class="step">更新画像</text>
  <text x="965" y="679" text-anchor="middle" class="note">可信评分才更新</text>
  <path d="M1055 662 L1115 662" class="dash"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 712" width="680" height="712">
  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 2L8 5L1 8" fill="#888"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .t { font: 13px sans-serif; fill: #2C2C2A; }
      .ts { font: 11px sans-serif; fill: #5F5E5A; }
      .th { font: 500 13px sans-serif; fill: #2C2C2A; }
      .title { font: 700 17px sans-serif; fill: #2C2C2A; }
      .subtitle { font: 12px sans-serif; fill: #5F5E5A; }
      .arr { stroke: #888; stroke-width: 1.8; fill: none; marker-end: url(#arr-d); }
      .arr-dash { stroke: #888; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; marker-end: url(#arr-d); }
      .loop { stroke: #1D9E75; stroke-width: 1.8; fill: none; stroke-dasharray: 6 3; marker-end: url(#arr-d); }
      .node-blue { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1.4; }
      .node-purple { fill: #EEEDFE; stroke: #7F77DD; stroke-width: 1.4; }
      .node-green { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 1.4; }
      .node-orange { fill: #FAECE7; stroke: #D85A30; stroke-width: 1.4; }
      .node-gray { fill: #F1EFE8; stroke: #888780; stroke-width: 1.2; }
      .txt-blue { fill: #042C53; }
      .txt-purple { fill: #26215C; }
      .txt-green { fill: #04342C; }
      .txt-orange { fill: #712B13; }
      .txt-gray { fill: #2C2C2A; }
    </style>
  </defs>

  <rect class="bg" width="680" height="668"/>
  <text class="title" x="340" y="26" text-anchor="middle">学习训练系统 · 核心闭环</text>
  <text class="subtitle" x="340" y="46" text-anchor="middle">资料摄入 → 检索召回 → 问答 / 面试 → 评分 → 画像 → 下一轮训练</text>

  <!-- Row A -->
  <rect class="node-blue" x="30" y="62" width="143" height="76" rx="8"/>
  <text class="th txt-blue" x="101" y="82" text-anchor="middle">1 上传资料</text>
  <text class="ts" x="101" y="102" text-anchor="middle">Markdown / TXT</text>
  <text class="ts" x="101" y="120" text-anchor="middle">PDF / DOCX</text>

  <rect class="node-blue" x="189" y="62" width="143" height="76" rx="8"/>
  <text class="th txt-blue" x="260" y="82" text-anchor="middle">2 解析切分</text>
  <text class="ts" x="260" y="102" text-anchor="middle">DocumentParser</text>
  <text class="ts" x="260" y="120" text-anchor="middle">heading + chunk</text>

  <rect class="node-blue" x="348" y="62" width="143" height="76" rx="8"/>
  <text class="th txt-blue" x="419" y="82" text-anchor="middle">3 存储索引</text>
  <text class="ts" x="419" y="102" text-anchor="middle">pgvector + Embedding</text>
  <text class="ts" x="419" y="120" text-anchor="middle">dev 默认 / BGE 部署</text>

  <rect class="node-blue" x="507" y="62" width="143" height="76" rx="8"/>
  <text class="th txt-blue" x="578" y="82" text-anchor="middle">4 检索召回</text>
  <text class="ts" x="578" y="102" text-anchor="middle">全文 + 向量</text>
  <text class="ts" x="578" y="120" text-anchor="middle">RRF 融合</text>

  <line x1="173" y1="100" x2="187" y2="100" class="arr"/>
  <line x1="332" y1="100" x2="346" y2="100" class="arr"/>
  <line x1="491" y1="100" x2="505" y2="100" class="arr"/>

  <!-- Row B -->
  <rect class="node-orange" x="344" y="196" width="151" height="88" rx="8"/>
  <text class="th txt-orange" x="419" y="216" text-anchor="middle">5B 生成题目</text>
  <text class="ts" x="419" y="236" text-anchor="middle">题目 / 答案 / Rubric</text>
  <text class="ts" x="419" y="254" text-anchor="middle">训练：3 题 medium</text>
  <text class="ts" x="419" y="272" text-anchor="middle">practice：1/3/5 题 · 三档难度</text>

  <rect class="node-purple" x="507" y="196" width="143" height="76" rx="8"/>
  <text class="th txt-purple" x="578" y="216" text-anchor="middle">5A RAG 问答</text>
  <text class="ts" x="578" y="236" text-anchor="middle">带引用回答</text>
  <text class="ts" x="578" y="254" text-anchor="middle">证据不足显式降级</text>

  <line x1="578" y1="138" x2="578" y2="194" class="arr"/>
  <line x1="520" y1="138" x2="440" y2="194" class="arr"/>

  <!-- Row C -->
  <rect class="node-blue" x="348" y="324" width="143" height="68" rx="8"/>
  <text class="th txt-blue" x="419" y="344" text-anchor="middle">6 用户回答</text>
  <text class="ts" x="419" y="364" text-anchor="middle">Idempotency-Key</text>
  <text class="ts" x="419" y="382" text-anchor="middle">真实回答或参考答案</text>

  <rect class="node-orange" x="189" y="324" width="143" height="68" rx="8"/>
  <text class="th txt-orange" x="260" y="344" text-anchor="middle">7 可信评分</text>
  <text class="ts" x="260" y="364" text-anchor="middle">四维 Rubric</text>
  <text class="ts" x="260" y="382" text-anchor="middle">引用白名单校验</text>

  <rect class="node-orange" x="30" y="324" width="143" height="68" rx="8"/>
  <text class="th txt-orange" x="101" y="344" text-anchor="middle">8 面试报告</text>
  <text class="ts" x="101" y="364" text-anchor="middle">总分与逐题解析</text>
  <text class="ts" x="101" y="382" text-anchor="middle">历史趋势</text>

  <line x1="419" y1="284" x2="419" y2="322" class="arr"/>
  <line x1="348" y1="358" x2="334" y2="358" class="arr"/>
  <line x1="189" y1="358" x2="175" y2="358" class="arr"/>

  <!-- Row D -->
  <rect class="node-green" x="30" y="436" width="143" height="68" rx="8"/>
  <text class="th txt-green" x="101" y="456" text-anchor="middle">9 更新画像</text>
  <text class="ts" x="101" y="476" text-anchor="middle">稳定主题 + 动态证据</text>
  <text class="ts" x="101" y="494" text-anchor="middle">复习 / 可验证查漏</text>

  <rect class="node-gray" x="189" y="436" width="143" height="68" rx="8"/>
  <text class="th txt-gray" x="260" y="456" text-anchor="middle">practice 终点</text>
  <text class="ts" x="260" y="476" text-anchor="middle">报告保留模式标签</text>
  <text class="ts" x="260" y="494" text-anchor="middle">不写画像 / coverage</text>

  <line x1="101" y1="392" x2="101" y2="434" class="arr"/>
  <text class="ts" x="108" y="416">profile_training</text>
  <line x1="150" y1="392" x2="240" y2="434" class="arr-dash"/>
  <text class="ts" x="206" y="406" text-anchor="middle">practice</text>

  <!-- 反馈环 -->
  <path d="M101 504 L101 524 L20 524 L20 178 L419 178 L419 192" class="loop"/>
  <text class="ts" x="219" y="170" text-anchor="middle">画像与可验证 coverage 反哺下一轮训练（仅正式训练）</text>

  <!-- 关键可信边界 -->
  <rect class="node-gray" x="30" y="548" width="620" height="56" rx="8"/>
  <text class="th txt-gray" x="340" y="568" text-anchor="middle">关键可信边界</text>
  <text class="ts" x="340" y="590" text-anchor="middle">证据不足不能硬答；伪造引用不进可信结果；低置信评分降权更新；practice 不写画像与 coverage</text>

  <!-- 图例 -->
  <rect x="28" y="630" width="624" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <rect x="40" y="635" width="14" height="12" rx="2" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text class="ts" x="58" y="645" dominant-baseline="central">流程步骤</text>
  <rect x="104" y="635" width="14" height="12" rx="2" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text class="ts" x="122" y="645" dominant-baseline="central">RAG 问答</text>
  <rect x="172" y="635" width="14" height="12" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text class="ts" x="190" y="645" dominant-baseline="central">LLM 生成与评分</text>
  <rect x="272" y="635" width="14" height="12" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text class="ts" x="290" y="645" dominant-baseline="central">画像闭环</text>
  <rect x="346" y="635" width="14" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="ts" x="364" y="645" dominant-baseline="central">practice 边界与提示</text>
</svg>

<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <style>
    .nt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .ns { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
    .tm { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
    .ts { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .loop { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #10b981; }
    .br { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 600; fill: #64748b; }
  </style>

  <!-- 标题 -->
  <text x="340" y="26" text-anchor="middle" class="tm">学习训练系统 · 核心数据流</text>
  <text x="340" y="42" text-anchor="middle" class="ts">资料摄入 → 检索召回 → 问答 / 面试 → 评分 → 画像闭环</text>

  <!-- 阶段标注 -->
  <text x="340" y="56" text-anchor="middle" class="br">━ 摄入索引 ━━━━━━ 检索 ━━━━━━ 训练评估 ━━ 闭环 ━</text>

  <!-- ===== Row 1: 1 → 2 → 3 → 4 (蓝) ===== -->
  <g filter="url(#sh)">
    <rect x="18" y="64" width="140" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="88" y="88" text-anchor="middle" class="nt">1. 上传学习资料</text>
  <text x="88" y="106" text-anchor="middle" class="ns">Markdown · TXT</text>
  <text x="88" y="122" text-anchor="middle" class="ns">· PDF · DOCX</text>

  <g filter="url(#sh)">
    <rect x="186" y="64" width="140" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="256" y="88" text-anchor="middle" class="nt">2. 解析与切分</text>
  <text x="256" y="106" text-anchor="middle" class="ns">DocumentParser</text>
  <text x="256" y="122" text-anchor="middle" class="ns">· 分块策略</text>

  <g filter="url(#sh)">
    <rect x="354" y="64" width="140" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="424" y="88" text-anchor="middle" class="nt">3. 存储与索引</text>
  <text x="424" y="106" text-anchor="middle" class="ns">PostgreSQL</text>
  <text x="424" y="122" text-anchor="middle" class="ns">· pgvector</text>

  <g filter="url(#sh)">
    <rect x="522" y="64" width="140" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="592" y="88" text-anchor="middle" class="nt">4. 检索召回</text>
  <text x="592" y="106" text-anchor="middle" class="ns">向量检索为主</text>
  <text x="592" y="122" text-anchor="middle" class="ns">预留全文检索 · RRF</text>

  <!-- 1→2→3→4 -->
  <line x1="158" y1="101" x2="184" y2="101" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="326" y1="101" x2="352" y2="101" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="494" y1="101" x2="520" y2="101" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 4 → 5B (直下) -->
  <path d="M 592 138 L 592 178" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
  <!-- 4 → 5A (左下折弯) -->
  <path d="M 592 138 L 592 152 L 424 152 L 424 178" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ===== Row 2: 5A (紫, 终点分支) / 5B (青, 训练链起点) ===== -->
  <g filter="url(#sh)">
    <rect x="354" y="182" width="140" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="424" y="206" text-anchor="middle" class="nt">5A. RAG 问答</text>
  <text x="424" y="224" text-anchor="middle" class="ns">基于证据生成带引用回答</text>
  <text x="424" y="240" text-anchor="middle" class="ns">证据不足时显式降级</text>

  <g filter="url(#sh)">
    <rect x="522" y="182" width="140" height="74" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="592" y="206" text-anchor="middle" class="nt">5B. 生成面试题</text>
  <text x="592" y="224" text-anchor="middle" class="ns">主题 + 难度 + 检索片段</text>
  <text x="592" y="240" text-anchor="middle" class="ns">题目 · 参考答案 · Rubric</text>

  <!-- 5B → 6 (直下) -->
  <path d="M 592 256 L 592 298" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ===== Row 3: 9 ← 8 ← 7 ← 6 (向左) ===== -->
  <g filter="url(#sh)">
    <rect x="522" y="302" width="140" height="74" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="592" y="326" text-anchor="middle" class="nt">6. 用户回答</text>
  <text x="592" y="344" text-anchor="middle" class="ns">真实回答或参考答案</text>
  <text x="592" y="360" text-anchor="middle" class="ns">幂等键避免重复提交</text>

  <g filter="url(#sh)">
    <rect x="354" y="302" width="140" height="74" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="424" y="326" text-anchor="middle" class="nt">7. 可信评分</text>
  <text x="424" y="344" text-anchor="middle" class="ns">四维 Rubric + 引用白名单</text>
  <text x="424" y="360" text-anchor="middle" class="ns">LLM 失败时规则降级</text>

  <g filter="url(#sh)">
    <rect x="186" y="302" width="140" height="74" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  </g>
  <text x="256" y="326" text-anchor="middle" class="nt">8. 面试报告</text>
  <text x="256" y="344" text-anchor="middle" class="ns">总分与逐题解析</text>
  <text x="256" y="360" text-anchor="middle" class="ns">最终分由应用层计算</text>

  <g filter="url(#sh)">
    <rect x="18" y="302" width="140" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="88" y="326" text-anchor="middle" class="nt">9. 更新能力画像</text>
  <text x="88" y="344" text-anchor="middle" class="ns">消费评分结果</text>
  <text x="88" y="360" text-anchor="middle" class="ns">能力 · 错误 · 复习 · 下轮</text>

  <!-- 6→7→8→9 (向左) -->
  <line x1="522" y1="339" x2="496" y2="339" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="354" y1="339" x2="328" y2="339" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="186" y1="339" x2="160" y2="339" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 9 → 5B 反哺闭环 (虚线，左缘上绕) -->
  <path d="M 18 339 L 6 339 L 6 164 L 520 164 L 520 180" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ard)"/>
  <text x="200" y="158" class="loop">↻ 反哺下一轮训练</text>

  <!-- 分叉标注 -->
  <text x="510" y="170" text-anchor="end" class="br">分叉</text>
</svg>

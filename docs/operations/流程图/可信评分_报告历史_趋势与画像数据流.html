<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">

  </defs>

  <rect width="680" height="560" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#1E293B">可信评分 · 报告历史 · 趋势与画像数据流</text>

  <!-- ===== Layer 1: Input ===== -->
  <text x="20" y="42" font-size="11" font-weight="500" fill="#64748B">① 输入</text>
  <rect x="38" y="46" width="140" height="34" rx="7" fill="#3B82F6"/>
  <text x="108" y="63" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Questions</text>
  <text x="108" y="75" text-anchor="middle" font-size="9" fill="#DBEAFE">面试题目</text>

  <rect x="348" y="46" width="140" height="34" rx="7" fill="#3B82F6"/>
  <text x="418" y="63" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Rubric</text>

  <text x="348" y="97" font-size="9" fill="#64748B">completed interview</text>

  <!-- ===== Layer 2: Scoring Engine ===== -->
  <text x="20" y="118" font-size="11" font-weight="500" fill="#64748B">② 评分引擎</text>
  <rect x="20" y="122" width="310" height="50" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="175" y="140" text-anchor="middle" font-size="12" font-weight="500" fill="#9A3412">LLM 结构化评分建议</text>
  <text x="175" y="155" text-anchor="middle" font-size="9" fill="#C2410C">仅提供四维得分建议</text>
  <text x="175" y="166" text-anchor="middle" font-size="9" fill="#FB923C">概率性 · 不计算最终总分</text>
  <rect x="350" y="122" width="310" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="505" y="140" text-anchor="middle" font-size="12" font-weight="500" fill="#1E40AF">应用层 · 计算最终总分</text>
  <text x="505" y="155" text-anchor="middle" font-size="9" fill="#3B82F6">综合四维得分 · 加权汇总</text>
  <text x="505" y="166" text-anchor="middle" font-size="9" fill="#60A5FA">确定性 · 可追溯</text>

  <!-- Arrow -->
  <line x1="340" y1="176" x2="340" y2="196" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="20" y="210" font-size="11" font-weight="500" fill="#64748B">③ 四维评分</text>

  <text x="108" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">correctness</text>
  <text x="108" y="243" text-anchor="middle" font-size="9" fill="#CCFBF1">正确性</text>
  <rect x="193" y="214" width="140" height="34" rx="7" fill="#14B8A6"/>
  <text x="263" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">completeness</text>
  <text x="263" y="243" text-anchor="middle" font-size="9" fill="#CCFBF1">完整性</text>
  <rect x="348" y="214" width="140" height="34" rx="7" fill="#14B8A6"/>
  <text x="418" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">reasoning</text>
  <text x="418" y="243" text-anchor="middle" font-size="9" fill="#CCFBF1">推理过程</text>
  <rect x="503" y="214" width="140" height="34" rx="7" fill="#14B8A6"/>
  <text x="573" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">communication</text>
  <text x="573" y="243" text-anchor="middle" font-size="9" fill="#CCFBF1">表达沟通</text>

  <!-- Arrow -->
  <line x1="340" y1="252" x2="340" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ===== Layer 4: Review Routing ===== -->
  <text x="20" y="286" font-size="11" font-weight="500" fill="#64748B">④ 复核路由</text>
  <rect x="40" y="290" width="180" height="40" rx="8" fill="#22C55E"/>
  <text x="130" y="308" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">final</text>
  <text x="130" y="322" text-anchor="middle" font-size="9" fill="#DCFCE7">可信 · 进入报告与画像</text>
  <rect x="250" y="290" width="180" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="340" y="308" text-anchor="middle" font-size="12" font-weight="500" fill="#92400E">review_pending</text>
  <text x="340" y="322" text-anchor="middle" font-size="9" fill="#B45309">待复核 · 保留评分</text>
  <rect x="460" y="290" width="180" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="550" y="308" text-anchor="middle" font-size="12" font-weight="500" fill="#92400E">disputed</text>
  <text x="550" y="322" text-anchor="middle" font-size="9" fill="#B45309">争议 · 保留评分</text>

  <!-- Branch arrows -->
  <line x1="130" y1="332" x2="130" y2="362" stroke="#22C55E" stroke-width="2" marker-end="url(#ahg)"/>
  <rect x="100" y="340" width="60" height="16" rx="3" fill="#FAFBFC"/>
  <text x="130" y="352" text-anchor="middle" font-size="10" font-weight="500" fill="#22C55E">final</text>

  <line x1="550" y1="332" x2="550" y2="362" stroke="#F59E0B" stroke-width="2" marker-end="url(#aha)"/>
  <rect x="478" y="340" width="144" height="16" rx="3" fill="#FAFBFC"/>
  <text x="550" y="352" text-anchor="middle" font-size="10" font-weight="500" fill="#F59E0B">pending / disputed</text>

  <!-- ===== Layer 5: Report + Block ===== -->
  <text x="20" y="376" font-size="11" font-weight="500" fill="#64748B">⑤ 报告</text>
  <rect x="20" y="380" width="170" height="40" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>
  <text x="105" y="398" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">当前详情</text>
  <text x="105" y="412" text-anchor="middle" font-size="9" fill="#16A34A">逐题解析 · 总分</text>
  <rect x="205" y="380" width="150" height="40" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">历史列表</text>
  <text x="280" y="412" text-anchor="middle" font-size="9" fill="#16A34A">多场面试记录</text>
  <rect x="370" y="380" width="150" height="40" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>

  <text x="445" y="412" text-anchor="middle" font-size="9" fill="#16A34A">能力变化曲线</text>

  <!-- Block symbol -->
  <circle cx="590" cy="400" r="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <line x1="578" y1="388" x2="602" y2="412" stroke="#EF4444" stroke-width="2.5"/>

  <text x="590" y="446" text-anchor="middle" font-size="9" fill="#EF4444">保留评分记录</text>

  <!-- Arrow: report → output -->
  <line x1="250" y1="424" x2="250" y2="452" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ===== Layer 6: Output ===== -->
  <text x="20" y="466" font-size="11" font-weight="500" fill="#64748B">⑥ 输出</text>
  <rect x="20" y="470" width="300" height="46" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>

  <text x="170" y="504" text-anchor="middle" font-size="9" fill="#7C3AED">稳定主题画像 · 动态子知识点</text>
  <rect x="340" y="470" width="300" height="46" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="490" y="488" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">下一轮计划</text>
  <text x="490" y="504" text-anchor="middle" font-size="9" fill="#7C3AED">复习任务 · 专项训练 · 主题推荐</text>

  <!-- Arrow: 画像 → 计划 -->
  <line x1="320" y1="493" x2="340" y2="493" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ahp)"/>

  <!-- Block dashed line to profile -->
  <line x1="590" y1="446" x2="590" y2="470" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="590" y1="470" x2="322" y2="470" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="430" y="461" width="50" height="14" rx="2" fill="#FAFBFC"/>
  <text x="455" y="472" text-anchor="middle" font-size="9" fill="#EF4444" font-weight="500">× 不回写</text>

  <!-- Note box -->
  <rect x="20" y="528" width="640" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="544" text-anchor="middle" font-size="9" fill="#475569">LLM 仅提供结构化四维评分建议 · 应用层计算最终总分 · final 进入报告与画像 · pending/disputed 保留评分但阻断画像回写</text>
</svg>

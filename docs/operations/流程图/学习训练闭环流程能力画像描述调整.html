<svg viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .nt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
    .ns { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #64748b; }
    .tm { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
    .ts { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .ll { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
    .lg { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #475569; }
  </style>

  <!-- 标题 -->
  <text x="340" y="30" text-anchor="middle" class="tm">学习训练闭环流程</text>
  <text x="340" y="46" text-anchor="middle" class="ts">学 → 考 → 评 → 练 · 持续迭代</text>

  <!-- ===== 上排节点 ===== -->
  <!-- 1. 学习资料 (蓝) -->
  <g filter="url(#shadow)">
    <rect x="30" y="74" width="140" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="100" y="105" text-anchor="middle" class="nt">学习资料</text>
  <text x="100" y="122" text-anchor="middle" class="ns">教材 · 笔记 · 视频</text>

  <!-- 2. 知识库入库 (蓝) -->
  <g filter="url(#shadow)">
    <rect x="190" y="74" width="140" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="260" y="105" text-anchor="middle" class="nt">知识库入库</text>
  <text x="260" y="122" text-anchor="middle" class="ns">向量化 · 索引构建</text>

  <!-- 3. RAG 问答验证 (紫) -->
  <g filter="url(#shadow)">
    <rect x="350" y="74" width="140" height="68" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="420" y="105" text-anchor="middle" class="nt">RAG 问答验证</text>
  <text x="420" y="122" text-anchor="middle" class="ns">检索增强 · 答案校验</text>

  <!-- 4. 模拟面试 (紫) -->
  <g filter="url(#shadow)">
    <rect x="510" y="74" width="140" height="68" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="580" y="105" text-anchor="middle" class="nt">模拟面试</text>
  <text x="580" y="122" text-anchor="middle" class="ns">题库驱动 · 实战对答</text>

  <!-- 上排箭头 -->
  <line x1="170" y1="108" x2="186" y2="108" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="330" y1="108" x2="346" y2="108" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="490" y1="108" x2="506" y2="108" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 4→5 右侧下弯 -->
  <path d="M 580 142 L 580 250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== 下排节点 ===== -->
  <!-- 5. 评分报告 (琥珀) -->
  <g filter="url(#shadow)">
    <rect x="510" y="254" width="140" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="580" y="285" text-anchor="middle" class="nt">评分报告</text>
  <text x="580" y="302" text-anchor="middle" class="ns">多维打分 · 反馈明细</text>

  <!-- 6. 能力画像 (琥珀) —— 描述已调整 -->
  <g filter="url(#shadow)">
    <rect x="350" y="254" width="140" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="420" y="285" text-anchor="middle" class="nt">能力画像</text>
  <text x="420" y="302" text-anchor="middle" class="ns">个人能力画像 · 强弱项定位</text>

  <!-- 7. 复习计划 (绿) -->
  <g filter="url(#shadow)">
    <rect x="190" y="254" width="140" height="68" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="260" y="285" text-anchor="middle" class="nt">复习计划</text>
  <text x="260" y="302" text-anchor="middle" class="ns">薄弱项优先 · 个性化排期</text>

  <!-- 8. 下一轮训练 (绿) -->
  <g filter="url(#shadow)">
    <rect x="30" y="254" width="140" height="68" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="100" y="285" text-anchor="middle" class="nt">下一轮训练</text>
  <text x="100" y="302" text-anchor="middle" class="ns">针对性练习 · 迭代提升</text>

  <!-- 下排箭头 (向左) -->
  <line x1="510" y1="288" x2="494" y2="288" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="288" x2="334" y2="288" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="190" y1="288" x2="174" y2="288" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 8→1 闭环 (左侧上弯，虚线) -->
  <path d="M 30 288 L 14 288 Q 8 288 8 282 L 8 114 Q 8 108 14 108 L 26 108"
        fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-loop)"/>
  <text x="14" y="200" text-anchor="middle" class="ll" transform="rotate(-90 14 200)">闭环 · 迭代</text>

  <!-- 图例 -->
  <g transform="translate(150, 360)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="11" class="lg">输入 · 摄入存储</text>

    <rect x="110" y="0" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="130" y="11" class="lg">验证 · 核心考核</text>

    <rect x="225" y="0" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="245" y="11" class="lg">评估 · 反馈诊断</text>

    <rect x="340" y="0" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="360" y="11" class="lg">行动 · 个性化推进</text>
  </g>
</svg>

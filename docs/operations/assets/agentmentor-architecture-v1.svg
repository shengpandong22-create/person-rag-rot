<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="100%" role="img">
  <title>AgentMentor V1 Architecture</title>
  <desc>Overall architecture of AgentMentor V1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 22px sans-serif;fill:#0f172a}
      .sub{font:400 12px sans-serif;fill:#475569}
      .h{font:700 15px sans-serif}
      .t{font:400 11px sans-serif}
      .small{font:400 10px sans-serif}
    </style>
  </defs>

  <rect x="20" y="24" width="880" height="632" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="460" y="58" text-anchor="middle" class="title">AgentMentor V1 Architecture</text>
  <text x="460" y="82" text-anchor="middle" class="sub">Knowledge Ingestion · RAG QA · Interview Workflow · Evaluation · Profile · Docker Compose</text>

  <rect x="60" y="122" width="190" height="96" rx="12" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="155" y="150" text-anchor="middle" class="h" fill="#075985">React Frontend</text>
  <text x="155" y="174" text-anchor="middle" class="t" fill="#0369A1">frontend/src/main.jsx</text>
  <text x="155" y="194" text-anchor="middle" class="t" fill="#0369A1">Workspace / Interview / Report</text>

  <rect x="310" y="112" width="300" height="116" rx="12" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="460" y="140" text-anchor="middle" class="h" fill="#1E3A8A">FastAPI API Layer</text>
  <text x="460" y="164" text-anchor="middle" class="t" fill="#1D4ED8">knowledge.py · chat.py · interviews.py</text>
  <text x="460" y="184" text-anchor="middle" class="t" fill="#1D4ED8">evaluations.py · profiles.py · health.py</text>
  <text x="460" y="204" text-anchor="middle" class="small" fill="#1D4ED8">Protocol conversion, validation, dependency injection</text>

  <rect x="680" y="122" width="180" height="96" rx="12" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="770" y="150" text-anchor="middle" class="h" fill="#7F1D1D">LLM Provider</text>
  <text x="770" y="174" text-anchor="middle" class="t" fill="#B91C1C">DeepSeek / OpenAI compatible</text>
  <text x="770" y="194" text-anchor="middle" class="t" fill="#B91C1C">Fallback to fake baseline</text>

  <line x1="250" y1="170" x2="310" y2="170" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="170" x2="680" y2="170" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="460" y1="228" x2="460" y2="278" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="84" y="278" width="752" height="152" rx="16" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="108" y="306" class="h" fill="#4C1D95">Application Services</text>
  <text x="812" y="306" text-anchor="end" class="small" fill="#6D28D9">business orchestration, transactions, ports</text>

  <rect x="112" y="334" width="128" height="66" rx="10" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="176" y="358" text-anchor="middle" class="t" font-weight="700" fill="#4C1D95">KnowledgeService</text>
  <text x="176" y="378" text-anchor="middle" class="small" fill="#6D28D9">ingestion and index</text>

  <rect x="260" y="334" width="128" height="66" rx="10" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="324" y="358" text-anchor="middle" class="t" font-weight="700" fill="#4C1D95">AnswerService</text>
  <text x="324" y="378" text-anchor="middle" class="small" fill="#6D28D9">RAG answer</text>

  <rect x="408" y="334" width="128" height="66" rx="10" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="472" y="358" text-anchor="middle" class="t" font-weight="700" fill="#4C1D95">InterviewService</text>
  <text x="472" y="378" text-anchor="middle" class="small" fill="#6D28D9">question workflow</text>

  <rect x="556" y="334" width="128" height="66" rx="10" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="620" y="358" text-anchor="middle" class="t" font-weight="700" fill="#4C1D95">EvaluationService</text>
  <text x="620" y="378" text-anchor="middle" class="small" fill="#6D28D9">rubric report</text>

  <rect x="704" y="334" width="104" height="66" rx="10" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="756" y="358" text-anchor="middle" class="t" font-weight="700" fill="#4C1D95">ProfileService</text>
  <text x="756" y="378" text-anchor="middle" class="small" fill="#6D28D9">profile loop</text>

  <rect x="70" y="480" width="220" height="96" rx="12" fill="#ECFDF5" stroke="#059669"/>
  <text x="180" y="508" text-anchor="middle" class="h" fill="#065F46">Domain</text>
  <text x="180" y="532" text-anchor="middle" class="t" fill="#047857">knowledge · interview</text>
  <text x="180" y="552" text-anchor="middle" class="t" fill="#047857">evaluation · profile</text>
  <text x="180" y="570" text-anchor="middle" class="small" fill="#047857">pure rules, no framework dependency</text>

  <rect x="350" y="480" width="220" height="96" rx="12" fill="#FEF3C7" stroke="#D97706"/>
  <text x="460" y="508" text-anchor="middle" class="h" fill="#92400E">RAG / Workflows / Ports</text>
  <text x="460" y="532" text-anchor="middle" class="t" fill="#B45309">chunking · retrieval · documents</text>
  <text x="460" y="552" text-anchor="middle" class="t" fill="#B45309">llm gateway · embedding gateway</text>
  <text x="460" y="570" text-anchor="middle" class="small" fill="#B45309">external capability boundaries</text>

  <rect x="630" y="480" width="220" height="96" rx="12" fill="#F1F5F9" stroke="#475569"/>
  <text x="740" y="508" text-anchor="middle" class="h" fill="#334155">Infrastructure</text>
  <text x="740" y="532" text-anchor="middle" class="t" fill="#475569">database models / session</text>
  <text x="740" y="552" text-anchor="middle" class="t" fill="#475569">llm.py · embedding.py · retriever.py</text>
  <text x="740" y="570" text-anchor="middle" class="small" fill="#475569">PostgreSQL / pgvector / HTTP client</text>

  <line x1="336" y1="430" x2="180" y2="480" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="460" y1="430" x2="460" y2="480" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="584" y1="430" x2="740" y2="480" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="300" y="604" width="320" height="38" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="460" y="628" text-anchor="middle" class="t" font-weight="700" fill="#166534">Docker Compose: db + api + frontend, 16GB local machine friendly</text>
</svg>

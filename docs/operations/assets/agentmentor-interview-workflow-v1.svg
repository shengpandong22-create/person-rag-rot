<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" role="img">
  <title>AgentMentor Interview Workflow</title>
  <desc>Recoverable interview workflow with checkpoints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 22px sans-serif;fill:#0f172a}
      .h{font:700 13px sans-serif}
      .t{font:400 10px sans-serif}
      .note{font:400 12px sans-serif;fill:#475569}
    </style>
  </defs>

  <rect x="18" y="18" width="824" height="524" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="430" y="54" text-anchor="middle" class="title">Recoverable Interview Workflow</text>

  <rect x="70" y="96" width="170" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="155" y="126" text-anchor="middle" class="h" fill="#1E3A8A">create_interview</text>

  <line x1="240" y1="122" x2="312" y2="122" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="312" y="96" width="190" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="407" y="126" text-anchor="middle" class="h" fill="#1E3A8A">start: load_profile</text>

  <line x1="502" y1="122" x2="580" y2="122" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="580" y="96" width="190" height="52" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="675" y="126" text-anchor="middle" class="h" fill="#4C1D95">plan_interview</text>

  <line x1="675" y1="148" x2="675" y2="206" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="570" y="206" width="210" height="62" rx="10" fill="#FCE7F3" stroke="#DB2777"/>
  <text x="675" y="230" text-anchor="middle" class="h" fill="#9D174D">generate_question</text>
  <text x="675" y="250" text-anchor="middle" class="t" fill="#BE185D">retrieve chunks, create question and rubric</text>

  <line x1="570" y1="237" x2="492" y2="237" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="292" y="206" width="200" height="62" rx="10" fill="#FEF3C7" stroke="#D97706"/>
  <text x="392" y="230" text-anchor="middle" class="h" fill="#92400E">WAITING_FOR_ANSWER</text>
  <text x="392" y="250" text-anchor="middle" class="t" fill="#B45309">frontend shows current question</text>

  <line x1="292" y1="237" x2="212" y2="237" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="72" y="206" width="140" height="62" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="142" y="230" text-anchor="middle" class="h" fill="#075985">submit_answer</text>
  <text x="142" y="250" text-anchor="middle" class="t" fill="#0369A1">idempotent submit</text>

  <line x1="142" y1="268" x2="142" y2="330" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="72" y="330" width="160" height="58" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="152" y="354" text-anchor="middle" class="h" fill="#166534">persist_answer</text>
  <text x="152" y="374" text-anchor="middle" class="t" fill="#15803D">save UserAnswer</text>

  <line x1="232" y1="359" x2="322" y2="359" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="322" y="330" width="200" height="58" rx="10" fill="#F1F5F9" stroke="#475569"/>
  <text x="422" y="354" text-anchor="middle" class="h" fill="#334155">advance_question?</text>
  <text x="422" y="374" text-anchor="middle" class="t" fill="#475569">continue or finish</text>

  <path d="M522 348 L675 348 L675 268" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="604" y="338" class="t" fill="#475569">next</text>

  <line x1="422" y1="388" x2="422" y2="444" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="430" y="420" class="t" fill="#475569">last</text>

  <rect x="322" y="444" width="200" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="422" y="468" text-anchor="middle" class="h" fill="#991B1B">finish_interview</text>
  <text x="422" y="488" text-anchor="middle" class="t" fill="#B91C1C">status = completed</text>

  <line x1="522" y1="473" x2="594" y2="473" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="594" y="444" width="190" height="58" rx="10" fill="#FAE8FF" stroke="#A21CAF"/>
  <text x="689" y="468" text-anchor="middle" class="h" fill="#86198F">evaluate and report</text>
  <text x="689" y="488" text-anchor="middle" class="t" fill="#A21CAF">score, review, profile updates</text>

  <text x="70" y="526" class="note">WorkflowCheckpointModel records every node for restart, retry and demo visibility.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="100%" role="img">
  <title>AgentMentor Core Flow</title>
  <desc>Core learning loop from document ingestion to profile update.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 22px sans-serif;fill:#0f172a}
      .h{font:700 14px sans-serif}
      .t{font:400 11px sans-serif}
      .small{font:400 10px sans-serif}
    </style>
  </defs>

  <rect x="18" y="18" width="864" height="724" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="450" y="54" text-anchor="middle" class="title">AgentMentor Core Learning Loop</text>

  <rect x="72" y="96" width="210" height="64" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="177" y="122" text-anchor="middle" class="h" fill="#075985">1. Upload Materials</text>
  <text x="177" y="144" text-anchor="middle" class="t" fill="#0369A1">Markdown / TXT / PDF / DOCX</text>

  <line x1="282" y1="128" x2="342" y2="128" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="342" y="96" width="210" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="447" y="122" text-anchor="middle" class="h" fill="#166534">2. Parse and Chunk</text>
  <text x="447" y="144" text-anchor="middle" class="t" fill="#15803D">DocumentParser + chunk_sections</text>

  <line x1="552" y1="128" x2="612" y2="128" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="612" y="96" width="210" height="64" rx="10" fill="#FEF3C7" stroke="#D97706"/>
  <text x="717" y="122" text-anchor="middle" class="h" fill="#92400E">3. Store and Index</text>
  <text x="717" y="144" text-anchor="middle" class="t" fill="#B45309">PostgreSQL + pgvector</text>

  <line x1="717" y1="160" x2="717" y2="218" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="612" y="218" width="210" height="74" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="717" y="244" text-anchor="middle" class="h" fill="#4C1D95">4. Hybrid Retrieval</text>
  <text x="717" y="266" text-anchor="middle" class="t" fill="#6D28D9">full-text + vector + RRF</text>
  <text x="717" y="282" text-anchor="middle" class="small" fill="#6D28D9">retriever.py / retrieval.py</text>

  <path d="M612 255 L522 255" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="302" y="218" width="220" height="74" rx="10" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="412" y="244" text-anchor="middle" class="h" fill="#1E3A8A">5A. RAG QA</text>
  <text x="412" y="266" text-anchor="middle" class="t" fill="#1D4ED8">grounded answer with citations</text>
  <text x="412" y="282" text-anchor="middle" class="small" fill="#1D4ED8">explicit fallback when evidence is weak</text>

  <path d="M612 292 L522 390" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="302" y="362" width="220" height="86" rx="10" fill="#FCE7F3" stroke="#DB2777"/>
  <text x="412" y="388" text-anchor="middle" class="h" fill="#9D174D">5B. Interview Question</text>
  <text x="412" y="410" text-anchor="middle" class="t" fill="#BE185D">topic + difficulty + chunks</text>
  <text x="412" y="428" text-anchor="middle" class="small" fill="#BE185D">question, reference answer, rubric</text>

  <line x1="412" y1="448" x2="412" y2="506" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="302" y="506" width="220" height="74" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="412" y="532" text-anchor="middle" class="h" fill="#075985">6. User Answer</text>
  <text x="412" y="554" text-anchor="middle" class="t" fill="#0369A1">manual answer or generated reference</text>
  <text x="412" y="570" text-anchor="middle" class="small" fill="#0369A1">idempotency key avoids duplicate submit</text>

  <line x1="522" y1="543" x2="602" y2="543" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="602" y="506" width="220" height="74" rx="10" fill="#FAE8FF" stroke="#A21CAF"/>
  <text x="712" y="532" text-anchor="middle" class="h" fill="#86198F">7. Trusted Evaluation</text>
  <text x="712" y="554" text-anchor="middle" class="t" fill="#A21CAF">4D rubric + citation whitelist</text>
  <text x="712" y="570" text-anchor="middle" class="small" fill="#A21CAF">low confidence goes to reviewer route</text>

  <line x1="712" y1="580" x2="712" y2="632" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="602" y="632" width="220" height="74" rx="10" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="712" y="658" text-anchor="middle" class="h" fill="#991B1B">8. Report</text>
  <text x="712" y="680" text-anchor="middle" class="t" fill="#B91C1C">total score and per-question review</text>
  <text x="712" y="696" text-anchor="middle" class="small" fill="#B91C1C">final score calculated by application</text>

  <path d="M602 669 L522 669" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="302" y="632" width="220" height="74" rx="10" fill="#ECFDF5" stroke="#059669"/>
  <text x="412" y="658" text-anchor="middle" class="h" fill="#065F46">9. Profile Update</text>
  <text x="412" y="680" text-anchor="middle" class="t" fill="#047857">trusted evaluations only</text>
  <text x="412" y="696" text-anchor="middle" class="small" fill="#047857">ability, error, review task, next plan</text>

  <path d="M302 669 L176 669 L176 160" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="184" y="650" class="t" fill="#475569" font-style="italic">next training round</text>
</svg>

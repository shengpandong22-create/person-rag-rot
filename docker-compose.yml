services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentmentor
      POSTGRES_USER: agentmentor
      POSTGRES_PASSWORD: agentmentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmentor -d agentmentor"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g

  api:
    build:
      context: .
    environment:
      AGENT_MENTOR_APP_ENV: development
      AGENT_MENTOR_DATABASE_URL: postgresql+asyncpg://agentmentor:agentmentor@db:5432/agentmentor
      AGENT_MENTOR_ALEMBIC_DATABASE_URL: postgresql+psycopg://agentmentor:agentmentor@db:5432/agentmentor
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn agent_mentor.main:app --host 0.0.0.0 --port 8000"
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      AGENT_MENTOR_API_BASE: http://api:8000
    depends_on:
      - api
    mem_limit: 512m

volumes:
  postgres_data:
  uploads_data:
